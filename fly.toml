# fly.toml app configuration file generated for personal-website-brisk-lake-2714 on 2026-08-18T18:07:01+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'personal-website-brisk-lake-2714'
primary_region = 'arn'

[build]
[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']
  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

[[vm]]
  memory = '256mb'
  cpus = 1
  memory_mb = 256
